<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        body {
            background-color: #fde8bf;
            justify-content: center;
            font-family: 'Fraunces', Courier, monospace;
        }

        .thead {
            text-align: center;
            justify-content: center;
            font-family: 'Fraunces', Courier, monospace;
            font-size: 25px;
            margin-bottom: 0cm;
        }

        .shead {
            text-align: center;
            justify-content: center;
            font-family: 'Fraunces', Courier, monospace;
            font-size: 10px;
            margin-top: 0.20%;
        }

        .input-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            font-family: 'Bungee Spice', courier, monospace;
            margin-top: 2%;
        }

        .input-container label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 2px;
            color: #333;
        }

        .custom-input {
            font-family: 'Fraunces', Courier, monospace;
            width: 20%;
            max-width: 30%;
            padding: 5px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 12px;
            outline: none;
            margin-bottom: 12px;
        }

        .simple-button {
            background-color: green;
            color: white;
            font-size: 15px;
            font-family: 'Fraunces', Courier, monospace;
            border-radius: 12px;
            transition: background-color 0.2s ease;
            margin-top: 0.5%;
            width: fit-content;
            padding: 5px 10px;

        }

        .simple-button:hover {
            background-color: #1d4ed8;
        }

        .book-list-container {
            width: 680px;
            margin: 2% auto 0 auto;
            background-color: #ffffff;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }


        .action-group {
            display: flex;
            flex-direction: row;
            gap: 6px;
        }

        .action-btn {
            font-family: 'Fraunces', Courier, monospace;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .borrow-btn {
            background-color: #2563eb;
            color: white;
        }

        .borrow-btn:hover {
            background-color: #1d4ed8;
        }

        .borrower-name {
            font-family: 'Fraunces', Courier, monospace;
            font-size: 14px;
            color: #555;
            font-weight: 500;
        }

        .update-btn {
            background-color: #d97706;
            color: white;
        }

        .update-btn:hover {
            background-color: #b45309;
        }

        .return-btn {
            background-color: #4b5563;
            color: white;
        }

        .return-btn:hover {
            background-color: #374151;
        }

        .delete-btn {
            background-color: #dc2626;
            color: white;
        }

        .delete-btn:hover {
            background-color: #b91c1c;
        }

        .book-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }

        .book-table th {
            font-weight: bold;
            color: #666;
            padding: 10px;
            background-color: #fafafa;
        }

        .book-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #eeeeee;
            color: #444;
        }

        .status {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .status.available {
            background-color: #e6f4ea;
            color: #137333;
        }

        .status.borrowed {
            background-color: #fce8e6;
            color: #c5221f;
        }
    </style>
    <meta charset="UTF-8" />
    <title>LIBRARY SYSTEM</title>
</head>

</html>

<body>
    <h2 class="thead">THE SHELF</h2>
    <p class="shead">A use case to create a library management system <br> using React, Python and FastAPI</p>
    <div class="input-container">
        <label for="bookname">Book Name ~</label>
        <input type="text" id="bookname" class="custom-input">
        <label for="author">Author ~</label>
        <input type="text" id="authorname" class="custom-input">
        <button class="simple-button">Add Book</button>
    </div>
    <div class="book-list-container">
        <h3>Available Books</h3>
        <table class="book-table">
            <thead>
                <tr>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Status</th>
                    <th>Borrower</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>The Hobbit</td>
                    <td>J.R.R. Tolkien</td>
                    <td><span class="status available">Available</span></td>
                    <td class="borrower-name">-</td>
                    <td>
                        <div class="action-group">
                            <button class="action-btn borrow-btn">Borrow</button>
                            <button class="action-btn update-btn">Update</button>
                            <button class="action-btn delete-btn">Delete</button>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>Clean Code</td>
                    <td>Robert C. Martin</td>
                    <td><span class="status borrowed">Borrowed</span></td>
                    <td class="borrower-name">ABC</td>
                    <td>
                        <div class="action-group">
                            <button class="action-btn return-btn">Return</button>
                            <button class="action-btn update-btn">Update</button>
                            <button class="action-btn delete-btn">Delete</button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        alert("THIS IS A LIBRARY MANAGEMENT SYSTEM");
        'use strict';
        let message = "Hello!";
    </script>
</body>

</html>
