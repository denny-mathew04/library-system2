<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>LIBRARY SYSTEM</title>

    <!-- React and Babel CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #fde8bf;
            justify-content: center;
            font-family: 'Fraunces', Courier, monospace;
        }

        .thead {
            text-align: center;
            justify-content: center;
            font-family: 'Fraunces', Courier, monospace;
            font-size: 25px;
            margin-bottom: 0cm;
        }

        .shead {
            text-align: center;
            justify-content: center;
            font-family: 'Fraunces', Courier, monospace;
            font-size: 10px;
            margin-top: 0.20%;
        }

        .input-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            font-family: 'Bungee Spice', courier, monospace;
            margin-top: 2%;
        }

        .input-container label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 2px;
            color: #333;
        }

        .custom-input {
            font-family: 'Fraunces', Courier, monospace;
            width: 20%;
            max-width: 30%;
            padding: 5px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 12px;
            outline: none;
            margin-bottom: 12px;
        }

        .simple-button {
            background-color: green;
            color: white;
            font-size: 15px;
            font-family: 'Fraunces', Courier, monospace;
            border-radius: 12px;
            transition: background-color 0.2s ease;
            margin-top: 0.5%;
            width: fit-content;
            padding: 5px 10px;

        }

        .simple-button:hover {
            background-color: #1d4ed8;
        }

        .book-list-container {
            width: 680px;
            margin: 2% auto 0 auto;
            background-color: #ffffff;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .action-group {
            display: flex;
            flex-direction: row;
            gap: 6px;
        }

        .action-btn {
            font-family: 'Fraunces', Courier, monospace;
            font-size: 12px;
            font-weight: bold;
            padding: 6px 12px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .borrow-btn {
            color: black;
            outline-style: solid;
            outline-color: #1d4ed8;
            background-color: white;
            color: #374151;
        }

        .borrow-btn:hover {
            background-color: #1d4ed8;
        }

        .borrower-name {
            font-family: 'Fraunces', Courier, monospace;
            font-size: 14px;
            color: #555;
            font-weight: 500;
        }

        .update-btn {
            background-color: #d97706;
            color: white;
        }

        .update-btn:hover {
            background-color: #b45309;
        }

        .return-btn {
            background-color: white;
            color: black;
            outline-style: solid;
            outline-color: #4b5563;
        }

        .return-btn:hover {
            background-color: #374151;
        }

        .delete-btn {
            background-color: #dc2626;
            color: white;
        }

        .delete-btn:hover {
            background-color: #b91c1c;
        }

        .book-table {
            border-radius: 12px;
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
        }

        .book-table th {
            font-weight: bold;
            color: #666;
            padding: 10px;
            background-color: #fafafa;
        }

        .book-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #eeeeee;
            color: #444;
        }

        .status {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status.available {
            background-color: olivedrab;
            color: white;
        }

        .status.borrowed {
            background-color: lightcoral;
            color: white;
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <script type="text/babel">
        function LibraryApp() {
            const [books, setBooks] = React.useState([]);
            const [newbookname, setnewbookname] = React.useState("");
            const [newauthorname, setnewauthorname] = React.useState("");

            React.useEffect(() => {
                fetchBooks();
            }, []);

            const fetchBooks = () => {
                // Updated to 8001
                fetch("http://localhost:8001/books")
                    .then(response => response.json())
                    .then(data => {
                        setBooks(data);
                    })
                    .catch(error => console.error("Error fetching books:", error));
            };

            const handleAddBook = () => {
                if (newbookname === "" || newauthorname === "") {
                    alert("Please enter both a book name and author name");
                    return;
                }

                const BookData = {
                    name: newbookname,
                    author: newauthorname,
                    status: "available",
                    borrower: null
                };

                // Updated to 8001
                fetch("http://localhost:8001/books", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(BookData)
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data === "Book already exists") {
                            alert("This book is already in the library");
                        } else {
                            setnewbookname("");
                            setnewauthorname("");
                            fetchBooks();
                        }
                    })
                    .catch(error => console.error("Error adding book :", error));
            };

            const handleDeleteBook = (bookName) => {
                const nBookName = encodeURIComponent(bookName);

                // Updated to 8001
                fetch("http://localhost:8001/books/" + nBookName, {
                    method: "DELETE"
                })
                    .then(response => response.json())
                    .then(data => {
                        fetchBooks();
                    })
                    .catch(error => console.error("Error deleting book:", error));
            };

            const handleReturnBook = (bookName) => {
                // Updated to 8001
                fetch("http://localhost:8001/books/" + encodeURIComponent(bookName) + "/return", {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    }
                })
                    .then(response => response.json())
                    .then(data => {
                        fetchBooks();
                    })
                    .catch(error => console.error("Error returning book:", error));
            };

            const handleBorrowBook = (bookName) => {
                const borrowername = prompt("Enter the borrower name : ")

                if (!borrowername) {
                    return;
                }

                fetch("http://localhost:8001/books/" + encodeURIComponent(bookName) + "/borrow?borrower_name=" + encodeURIComponent(borrowername), {
                    method: "PUT",
                    headers: {
                        "Content-type": "application/json"
                    }
                })
                    .then(response => response.json())
                    .then(data => {
                        fetchBooks();
                    })
                    .catch(error => console.error("Error borrowing book:", error))
            };

            const handleUpdateBook = (book) => {

                const newname = prompt("Enter the new name of the book : ")
                const newauthorname = prompt("Enter the new author name of the book : ")

                if (!newname || !newauthorname) {
                    return;
                }

                const updatedbookdata = {
                    name: newname,
                    author: newauthorname,
                    status: book.status,
                    borrower: book.borrower
                }

                fetch("http://localhost:8001/books/" + encodeURIComponent(book.name), {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(updatedbookdata)
                })
                    .then(response => response.json())
                    .then(data => {
                        fetchBooks();
                    })
                    .catch(error => console.error("Error updating book:", error))
            };



            return (
                <div>
                    <h2 className="thead">THE SHELF</h2>
                    <p className="shead">A use case to create a library management system <br /> using React, Python and FastAPI</p>

                    <div className="input-container">
                        <label htmlFor="bookname">Book Name ~</label>
                        <input
                            type="text"
                            id="bookname"
                            className="custom-input"
                            value={newbookname}
                            onChange={(e) => setnewbookname(e.target.value)}
                        />
                        <label htmlFor="author">Author ~</label>
                        <input
                            type="text"
                            id="authorname"
                            className="custom-input"
                            value={newauthorname}
                            onChange={(e) => setnewauthorname(e.target.value)}
                        />
                        <button className="simple-button" onClick={handleAddBook}>Add Book</button>
                    </div>

                    <div className="book-list-container">
                        <h3>Available Books</h3>
                        <table className="book-table">
                            <thead>
                                <tr>
                                    <th>Book Name</th>
                                    <th>Author</th>
                                    <th>Status</th>
                                    <th>Borrower</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {books.map((book, index) => (
                                    <tr key={index}>
                                        <td>{book.name}</td>
                                        <td>{book.author}</td>
                                        <td>
                                            <span className={`status ${book.status === 'available' ? 'available' : 'borrowed'}`}>
                                                {book.status === 'available' ? 'Available' : 'Borrowed'}
                                            </span>
                                        </td>
                                        <td className="borrower-name">{book.borrower ? book.borrower : "-"}</td>
                                        <td>
                                            <div className="action-group">
                                                {book.status === 'available' ? (
                                                    <button className="action-btn borrow-btn" onClick={() => handleBorrowBook(book.name)}>Borrow</button>
                                                ) : (
                                                    <button className="action-btn return-btn" onClick={() => handleReturnBook(book.name)}>Return</button>
                                                )}
                                                <button className="action-btn update-btn" onClick={() => handleUpdateBook(book)}>Update</button>
                                                <button className="action-btn delete-btn" onClick={() => handleDeleteBook(book.name)}>Delete</button>
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LibraryApp />);
    </script>
</body>

</html>
